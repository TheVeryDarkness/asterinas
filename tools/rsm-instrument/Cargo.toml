[package]
name = "rsm-instrument"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Build-time function hooks for the Asterinas RSM research prototype"

[dependencies]
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.77", features = ["full", "visit"] }
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
