[package]
name = "aster-rsm"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
inventory.workspace = true
ostd = { workspace = true, optional = true }

[features]
# The `ostd` feature enables the program loader and trampoline, which place and
# invoke code through OSTD. The pure decoding and relocation logic stays
# `ostd`-free so it can be unit-tested on the host with `--no-default-features`.
default = ["ostd"]
ostd = ["dep:ostd"]

[lints]
workspace = true
